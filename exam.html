<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam — NEXA</title>
  <link rel="stylesheet" href="exam-styles.css">
</head>
<body>
  <header class="examtop">
    <div class="examtop-inner">
      <span class="examtop-subject" id="subjectName">Subject</span>
      <span class="examtop-timer" id="timerDisplay">15:00</span>
    </div>
  </header>

  <main class="quiz" id="quizView">
    <section class="quiz-left">
      <div class="question-card">
        <p class="question-progress" id="questionProgress">Question 1 of 20</p>
        <p class="question-text" id="questionText"></p>
        <div class="options" id="optionsList"></div>

        <div class="quiz-nav-buttons">
          <button type="button" class="btn-secondary" id="prevBtn">&larr; Previous</button>
          <button type="button" class="btn-secondary" id="nextBtn">Next &rarr;</button>
        </div>
      </div>
    </section>

    <aside class="quiz-right">
      <p class="nav-title">Questions</p>
      <div class="nav-legend">
        <span><i class="dot dot--answered"></i> Answered</span>
        <span><i class="dot dot--unanswered"></i> Unanswered</span>
      </div>

      <div class="nav-grid" id="navGrid"></div>
      <button type="button" class="btn-submit" id="submitBtn">Submit Subject</button>
    </aside>
  </main>

  <main class="result" id="resultView" style="display:none;">
    <div class="result-card">
      <p class="result-label">Your Score</p>
      <h1 class="result-score" id="resultScore">0 / 20</h1>
      <p class="result-subject" id="resultSubject"></p>
      <p class="save-status" id="saveStatus" aria-live="polite"></p>

      <div class="result-actions">
        <a href="subjects.html" class="btn-primary">Back to Subjects</a>
      </div>
    </div>
  </main>

  <script src="exam-data.js"></script>
  <script type="module" src="exam.js"></script>
</body>
</html>
